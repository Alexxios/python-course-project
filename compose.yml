name: learning-platform

x-application: &application
  build:
    context: .
    dockerfile: services/app/Dockerfile
  image: learning-platform-app:local
  environment: &environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
    QUIZ_GENERATOR: ${QUIZ_GENERATOR:-local}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - learning-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["uv", "run", "--no-sync", "python", "-m", "app", "init-db"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  learning-postgres-data:
