version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  # Allure Action 0.10+ replaces per-report rows with an aggregate table.
  ignore:
  - dependency-name: allure-framework/allure-action
    versions: [">=0.10.0"]
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /.github
  schedule:
    interval: weekly
  versioning-strategy: increase
  groups:
    reporting:
      patterns:
      - '*'
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  versioning-strategy: increase
  groups:
    python-dependencies:
      patterns:
      - '*'
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
  groups:
    pre-commit-hooks:
      patterns:
      - '*'
- package-ecosystem: docker
  directories:
  - /services/*
  - /templates/service/*cookiecutter.package_name*
  schedule:
    interval: weekly
  groups:
    service-images:
      patterns:
      - '*'
- package-ecosystem: docker-compose
  directory: /infra
  schedule:
    interval: weekly
  groups:
    infrastructure-images:
      patterns:
      - '*'
