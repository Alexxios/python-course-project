name: Publish reports

on:
  workflow_call:
    inputs:
      pr-number:
        type: number
        default: 0

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize updates of the shared gh-pages branch with Pages deployments.
    concurrency:
      group: github-pages-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.pr-number != 0 && 'check-reports' || 'default-site' }}
          path: incoming/
      - name: Check for an existing Pages branch
        id: branch
        if: ${{ inputs.pr-number != 0 }}
        run: |
          ref=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [ -n "$ref" ]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; fi
      - name: Seed the main site before the first PR preview
        if: ${{ inputs.pr-number != 0 && steps.branch.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch "$DEFAULT_BRANCH" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          gh run download "$run_id" --name documentation --dir bootstrap
          gh run download "$run_id" --name check-reports --dir bootstrap/reports
      - name: Initialize Pages branch
        if: ${{ inputs.pr-number != 0 && steps.branch.outputs.exists != 'true' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: bootstrap
          force: false
      - name: Update main site or PR preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: incoming
          target-folder: ${{ inputs.pr-number != 0 && format('pr-preview/pr-{0}', inputs.pr-number) || '' }}
          clean-exclude: ${{ inputs.pr-number == 0 && 'pr-preview/' || '' }}
          force: false
