name: Default branch checks and Pages deployment

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: default-branch-pages
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/checks.yml
    with:
      publish: true
