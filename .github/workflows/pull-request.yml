name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      changed-since: ${{ github.event.pull_request.base.sha }}

  allure-summary:
    name: Allure report summary
    needs: checks
    # Fork and Dependabot runs have read-only tokens; their reports remain in artifacts.
    if: >-
      ${{ !cancelled() && needs.checks.outputs.allure-ready == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      checks: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: check-reports
          path: reports/
      - name: Collect Allure reports
        # Exclude the unrelated summary.json files generated by just reports.
        run: |
          while IFS= read -r -d '' report; do
            relative="${report#reports/}"
            mkdir -p "allure-reports/$(dirname "$relative")"
            mv "$report" "allure-reports/$relative"
          done < <(find reports -type d -name allure -prune -print0)
      - name: Post Allure summary
        uses: allure-framework/allure-action@v0
        with:
          report-directory: allure-reports/
          github-token: ${{ github.token }}
