[project]
name = "python-course-project"
version = "0.1.0"
description = "A Python course project with a FastAPI application."
authors = [{ name = "Ace of Cups", email = "aglotov@ithse.ru" }]
readme = "README.md"
requires-python = ">=3.14"

# Central runtime version requirements; members declare names and required extras.
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.6",
    "pydantic[email]>=2.14.2",
    "pydantic-settings>=2.16.2",
    "celery>=5.6.3",
    "structlog>=26.1.0",
    "sentry-sdk>=2.73.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-instrumentation-celery>=0.66b2",
]
# End of shared runtime dependencies.


[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
    "jinja2>=3.1.6",
    "uv>=0.13.6",
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "schemathesis>=4.33.0",
    "hypothesis>=6.170.14",
    "respx>=0.23.1",
    "testcontainers[postgres,redis]>=4.15.0",
    "pytest-cov>=7.1.0",
    "playwright>=1.64.1",
    "pytest-playwright>=0.10.0",
    "allure-pytest>=2.16.2",
    "coverage>=7.17.0",
    "pre-commit>=4.7.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
]
# End of tooling dependencies.

# The root manages shared dependencies and tooling; workspace members are installable packages.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]
exclude = ["services/.*", "libs/.*"]

[tool.ruff]
src = ["services/*/src", "libs/*/src"]
line-length = 100
target-version = "py314"
extend-exclude = ["templates", "site", "reports", ".venvs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=html:reports/integration/coverage",
    "--cov-report=xml:reports/integration/coverage.xml",
    "--cov-report=json:reports/integration/coverage.json",
    "--junitxml=reports/integration/junit.xml",
    "--alluredir=reports/integration/allure-results",
    "--clean-alluredir",
    "--video=retain-on-failure",
    "--output=reports/integration/playwright",
]
norecursedirs = [".*", "templates", "site", "reports", "build", "dist"]

[tool.coverage.run]
data_file = "reports/integration/.coverage"
source = ["services", "libs"]
branch = true
omit = [
    "*/.venv/*", "*/.tox/*", "*/templates/*", "*/site/*", "*/reports/*",
    "*/build/*", "*/dist/*", "*/tests/*", "*/conftest.py",
]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
