apiVersion: apps/v1
kind: Deployment
metadata:
  name: "app"
  labels:
    app.kubernetes.io/name: "app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "app"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "app"
    spec:
      automountServiceAccountToken: false # Enable if the app needs in-cluster API credentials.
      containers:
        - name: "app"
          image: app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: learning-platform
                  key: database-url
          ports:
            - name: http
              containerPort: 80 # Matches Uvicorn's listening port in the Dockerfile.
          startupProbe: # Allow up to five minutes for application initialization.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe: # Stop routing traffic when the application is not ready.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe: # Restart the container after repeated failures.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources: # Tune scheduling requests and runtime limits for the workload.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
