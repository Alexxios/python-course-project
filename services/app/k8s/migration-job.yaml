apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: app:dev
          command: ["uv", "run", "--no-sync", "python", "-m", "app", "init-db"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: learning-platform
                  key: database-url
